name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zamin
          POSTGRES_PASSWORD: zamin_pass
          POSTGRES_DB: zamin_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zamin -d zamin_db"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://zamin:zamin_pass@localhost:5432/zamin_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Load base schema (db/init.sql)
        run: PGPASSWORD=zamin_pass psql -h localhost -U zamin -d zamin_db -f backend/db/init.sql

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run API tests
        working-directory: backend
        run: npm test

      - name: Dependency audit (high severity)
        working-directory: backend
        run: npm audit --audit-level=high || true
