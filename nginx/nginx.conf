events { worker_connections 1024; }

http {
  upstream api {
    server api:4000;
  }

  upstream minio {
    server minio:9000;
  }

  server {
    listen 80;
    server_name _;

    # Allow multi-image uploads (nginx defaults to 1MB which rejects 3+ photos)
    client_max_body_size 50M;

    # Property images served straight from object storage (public-read bucket).
    # More specific than /api/ so it takes precedence.
    location /api/media/ {
      proxy_pass         http://minio/zamin/;
      proxy_set_header   Host $host;
      proxy_http_version 1.1;
      proxy_buffering    off;
    }

    # Direct presigned uploads/downloads: pass the path THROUGH unchanged so the
    # SigV4 signature (signed for this host + /zamin/<key>) validates at MinIO.
    location /zamin/ {
      proxy_pass         http://minio;
      proxy_set_header   Host $host;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_request_buffering off;
    }

    # API proxy
    location /api/ {
      proxy_pass         http://api/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
