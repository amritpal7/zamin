version: "3.9"

services:
  # ── Backend API (Node + Express) ──────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zamin_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      # Clerk backend secret — get from dashboard.clerk.com
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      # Database (Postgres via Docker)
      DATABASE_URL: postgres://zamin:zamin_pass@db:5432/zamin_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - zamin_net

  # ── Postgres Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: zamin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zamin
      POSTGRES_PASSWORD: zamin_pass
      POSTGRES_DB: zamin_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamin -d zamin_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zamin_net

  # ── Nginx reverse proxy (routes /api → backend) ───────────
  nginx:
    image: nginx:alpine
    container_name: zamin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - zamin_net

  # ── Expo Dev Server (mobile) ──────────────────────────────
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: zamin_mobile
    restart: unless-stopped
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Go
      - "19001:19001" # Expo DevTools
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-localhost}
      # Clerk publishable key (safe to expose in client)
      - EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - EXPO_PUBLIC_API_URL=http://${HOST_IP:-localhost}/api
    volumes:
      - ./mobile:/app
      - /app/node_modules
    networks:
      - zamin_net

volumes:
  pg_data:

networks:
  zamin_net:
    driver: bridge
