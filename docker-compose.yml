version: "3.9"

services:
  # ── Backend API (Node + Express) ──────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zamin_api
    restart: unless-stopped
    ports:
      # Bound to localhost — the phone reaches the API through nginx (:80), not here.
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # Clerk backend secret — get from dashboard.clerk.com
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      # Database (Postgres via Docker). Creds default to dev values; override in prod via .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-zamin}:${POSTGRES_PASSWORD:-zamin_pass}@db:5432/${POSTGRES_DB:-zamin_db}
      # Object storage (MinIO now; swap to S3/R2 later via these vars only)
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zamin
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-zamin_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zamin_minio_secret}
      S3_PUBLIC_BASE: /media
      # Host the phone reaches — presigned upload URLs are signed for this.
      S3_PUBLIC_ENDPOINT: http://${HOST_IP:-localhost}
      # Redis (BullMQ job queue)
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - zamin_net

  # ── Redis (BullMQ job queue backend) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: zamin_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - zamin_net

  # ── Worker (background thumbnailing via BullMQ) ───────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zamin_worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-zamin}:${POSTGRES_PASSWORD:-zamin_pass}@db:5432/${POSTGRES_DB:-zamin_db}
      # Needed by the scheduled owner-liveness reconcile (Clerk Backend API)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      # How often to reconcile owners (ms). Default 6h.
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-21600000}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zamin
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-zamin_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zamin_minio_secret}
      S3_PUBLIC_BASE: /media
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - zamin_net

  # ── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:latest
    container_name: zamin_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zamin_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zamin_minio_secret}
    ports:
      # Bound to localhost — clients reach objects via nginx (/media, /zamin), never :9000 directly.
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - zamin_net

  # ── Postgres Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: zamin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zamin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zamin_pass}
      POSTGRES_DB: ${POSTGRES_DB:-zamin_db}
    ports:
      # Bound to localhost — never expose Postgres on the network. Prod: don't publish at all.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zamin_net

  # ── Nginx reverse proxy (routes /api → backend) ───────────
  nginx:
    image: nginx:alpine
    container_name: zamin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - zamin_net

  # ── Expo Dev Server (mobile) ──────────────────────────────
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: zamin_mobile
    restart: unless-stopped
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Go
      - "19001:19001" # Expo DevTools
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-localhost}
      # Clerk publishable key (safe to expose in client)
      - EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - EXPO_PUBLIC_API_URL=http://${HOST_IP:-localhost}/api
    volumes:
      - ./mobile:/app
      - /app/node_modules
    networks:
      - zamin_net

volumes:
  pg_data:
  minio_data:
  redis_data:

networks:
  zamin_net:
    driver: bridge
